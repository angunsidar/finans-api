name: Keep API Alive

on:
  schedule:
    # Her 5 dakikada bir çalışır (Render 15 dk'da uyutur, 5 dk yeterli)
    - cron: '*/5 * * * *'
  workflow_dispatch: # Manuel tetikleme için

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 60 \
            https://finans-api-ztnv.onrender.com/health)
          echo "Response code: $response"
          if [ "$response" = "200" ]; then
            echo "✅ API is alive"
          else
            echo "⚠️ API returned $response"
          fi
