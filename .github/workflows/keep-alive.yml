name: Keep API Alive

# ⚠️  Bu workflow devre dışı bırakıldı.
# Private repo'da 2.000 dk/ay limiti aşılıyor (8.640 dk/ay harcıyor).
# Bunun yerine UptimeRobot ücretsiz monitör kullan:
#   → https://uptimerobot.com
#   → URL: https://finans-api-ztnv.onrender.com/health
#   → Interval: 5 minutes

on:
  workflow_dispatch: # Sadece manuel tetikleme — otomatik schedule kaldırıldı

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 60 \
            https://finans-api-ztnv.onrender.com/health)
          echo "Response code: $response"
          if [ "$response" = "200" ]; then
            echo "✅ API is alive"
          else
            echo "⚠️ API returned $response"
          fi
