services:
  - type: web
    name: finans-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python -c "import os,subprocess; os.makedirs('data',exist_ok=True); os.path.exists('data/bist_universe.json') or subprocess.run(['python','fetch_universe.py'],check=True)"
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: API_KEYS
        sync: false   # Render dashboard'dan elle girilecek
      - key: RAPIDAPI_PROXY_SECRET
        sync: false   # RapidAPI'den alınacak
